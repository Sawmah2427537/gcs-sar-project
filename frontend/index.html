<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>SAR GCS Demo</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 80vh;
      width: 100%;
    }

    #panel {
      padding: 12px;
      background: #f5f5f5;
    }

    button {
      padding: 8px 12px;
      margin-right: 8px;
      cursor: pointer;
    }

    #summary {
      margin-top: 10px;
      padding: 10px;
      background: white;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div id="panel">
    <button onclick="generateMission()">Generate Mission</button>
    <button onclick="clearPoints()">Clear</button>

    <p>SAR Points: <span id="pointCount">0</span></p>
    <pre id="result"></pre>
    <div id="summary"></div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    const taipeiCenter = [25.0330, 121.5654];
    const map = L.map("map").setView(taipeiCenter, 13);

    const bounds = L.latLngBounds(
      [24.9, 121.3],
      [25.2, 121.7]
    );

    map.setMaxBounds(bounds);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19
    }).addTo(map);

    const baseLine = L.polyline([
      [25.0330, 121.50],
      [25.0330, 121.60]
    ], {
      color: "black",
      weight: 3,
      dashArray: "8, 8"
    }).addTo(map);

    baseLine.bindPopup("Safety Reference Line");

    let sarPoints = [];
    let markers = [];
    let lines = [];

    const basePoint = {
      id: "BASE",
      lat: 25.044103058360037,
      lon: 121.53384620979259
    };

    const baseMarker = L.circleMarker([basePoint.lat, basePoint.lon], {
      radius: 10,
      color: "black",
      fillColor: "yellow",
      fillOpacity: 1
    })
    .addTo(map)
    .bindPopup("Base / TAL");

    map.on("click", function(e) {
      if (!bounds.contains(e.latlng)) {
        alert("超出任務區域，請在台北任務範圍內選點");
        return;
      }
      const point = {
        id: "S" + (sarPoints.length + 1),
        lat: e.latlng.lat,
        lon: e.latlng.lng,
        priority: 1,
        hover_time: 30
      };

      sarPoints.push(point);

      const marker = L.circleMarker([point.lat, point.lon], {
        radius: 8,
        color: "gray",
        fillColor: "gray",
        fillOpacity: 0.8
      })
      .addTo(map)
      .bindPopup(point.id);

      markers.push(marker);

      document.getElementById("pointCount").innerText = sarPoints.length;
    });

    async function generateMission() {
      const data = {
        sar_points: sarPoints,
        uavs: [
          {
              id: "UAV1",
              speed: 8,
              battery_time: 900,
              base: basePoint
          },
          {
              id: "UAV2",
              speed: 8,
              battery_time: 900,
              base: basePoint
          }
        ]
      };

      const response = await fetch("http://127.0.0.1:5000/plan", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      document.getElementById("result").innerText =
        JSON.stringify(result, null, 2);

      drawMissions(result.missions);
      updateSummary(result.missions);
    }

    function drawMissions(missions) {
      markers.forEach(marker => map.removeLayer(marker));
      markers = [];

      lines.forEach(line => map.removeLayer(line));
      lines = [];

      missions.forEach(mission => {
        mission.path.forEach(point => {
          const pointColor = point.side === "left" ? "red" : "blue";

          const marker = L.circleMarker([point.lat, point.lon], {
            radius: 8,
            color: pointColor,
            fillColor: pointColor,
            fillOpacity: 0.8
          })
          .addTo(map)
          .bindPopup(`${point.id} / ${point.side} / ${mission.uav_id}`);

          markers.push(marker);
        });

        const route = [
          [basePoint.lat, basePoint.lon],
          ...mission.path.map(p => [p.lat, p.lon])
        ];

        if (route.length >= 2) {
          const lineColor = mission.uav_id === "UAV1" ? "red" : "blue";

          const line = L.polyline(route, {
            color: lineColor,
            weight: 4
          }).addTo(map);

          lines.push(line);
        }
      });
    }

    function updateSummary(missions) {
        let html = "";

        missions.forEach(mission => {
            html += `
            <div style="margin-bottom:10px;">
                <b>${mission.uav_id}</b><br>
                Points: ${mission.path.length}<br>
                ETA: ${mission.eta} sec
            </div>
            `;
        });

        document.getElementById("summary").innerHTML = html;
    }
    
    function clearPoints() {
      sarPoints = [];

      markers.forEach(marker => map.removeLayer(marker));
      markers = [];

      lines.forEach(line => map.removeLayer(line));
      lines = [];

      document.getElementById("pointCount").innerText = 0;
      document.getElementById("result").innerText = "";
    }
  </script>
</body>
</html>
